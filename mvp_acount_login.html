<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@200" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon-16x16.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KW Newsletter App - Login</title>

  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #212121;
      --muted: #6b7280;
      --border: #ededed;
      --primary: #00929C;
      --primary-hover: #077A85;
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #ffffff;
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: 100%;
      max-width: 460px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-block img {
      width: 41px;
      height: 54px;
    }

    .app-name {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .app-name .title {
      font-family: 'Raleway';
      font-weight: 900;
      font-size: 25px;
      color: #00929c;
      margin-left: -10px;
    }

    .app-name .subtitle {
      font-family: 'Raleway';
      font-weight: 600;
      font-size: 17px;
      color: #825e8b;
      margin-left: -10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .subtext {
      margin-bottom: 20px;
      font-size: 14px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,0.12);
      outline: none;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .toggle .material-symbols-outlined {
      font-size: 20px;
      font-variation-settings: 'wght' 200;
      line-height: 1;
      display: block;
    }

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }

    .forgot {
      text-align: right;
      font-size: 13px;
    }

    .forgot a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: white;
    }

    .btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>

<body>
  <main class="shell">
    <section class="card">

      <div class="header">
        <div class="logo-block">
<img src="images/favicon-16x16.png" alt="KeelWorks Logo" width="41" height="54" />
          <div class="app-name">
            <span class="title">KeelWorks</span>
            <span class="subtitle">Newsletter App</span>
          </div>
        </div>
      </div>

      <h1>Login</h1>
      <p class="subtext">Enter your credentials to access your account.</p>

      <form>
        <div>
          <label>Email</label>
          <input id="email" type="text" placeholder="Your KeelWorks Email" />
          <p id="emailError"
          style="font-family:Lato, sans-serif; font-size:13px; color:#b91c1c; margin-top:4px; display:none;">
        </p>
      </div>

        <div>
          <label>Password</label>
          <div class="input-wrap">
            <input id="password" type="password" placeholder="Your Password" />
            <button type="button" class="toggle" id="togglePassword" aria-label="Show password"><span class="material-symbols-outlined">visibility_off</span></button>
          </div>
          <p id="passwordError" style="font-family:Lato, sans-serif; font-size:13px; color:#b91c1c; margin-top:4px; display:none;">
            Invalid password, try again.
          </p>
        </div>

        <div class="forgot">
          <a href="mvp_account_reset_password.html">Forgot password?</a>
        </div>
        <a href="mvp_app_home.html">
        <button class="btn" type="login">Login</button>
      </a>
      </form>

    </section>
  </main>

  <script>
  const form = document.querySelector('form');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');

const emailError = document.getElementById('emailError');
const passwordError = document.getElementById('passwordError');

function showEmailError(message) {
  emailError.textContent = message;
  emailError.style.display = 'block';
}

function hideEmailError() {
  emailError.style.display = 'none';
}

function showPasswordError() {
  passwordError.style.display = 'block';
}

function hidePasswordError() {
  passwordError.style.display = 'none';
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

form.addEventListener('submit', function (e) {
  e.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  let valid = true;

  hideEmailError();
  hidePasswordError();

  // ✅ EMAIL RULES
  if (!email) {
    showEmailError('Please enter your email.');
    valid = false;
  } else if (!isValidEmail(email)) {
    showEmailError('Please enter an valid email.');
    valid = false;
  } else if (email !== 'user@keelworks.com') {
    showEmailError("The email doesn't match the account record, please try again.");
    valid = false;
  }

  // ✅ PASSWORD RULE
  if (!password) {
    showPasswordError();
    valid = false;
  }

  if (valid) {
    alert('Login success (mock)');
  }
});

const togglePasswordButton = document.getElementById('togglePassword');

if (togglePasswordButton && passwordInput) {
  togglePasswordButton.addEventListener('click', function () {
    const icon = togglePasswordButton.querySelector('.material-symbols-outlined');
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    if (icon) {
      icon.textContent = isPassword ? 'visibility' : 'visibility_off';
    }
  });
}

  </script>
</body>
</html>
